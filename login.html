<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AdPesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: { DEFAULT: '#E50914', hover: '#B91C1C' },
                        brandGreen: { DEFAULT: '#009A44', hover: '#007A36' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans">
    <nav class="bg-white border-b px-6 py-4">
        <a href="index.html" class="text-2xl font-black"><span class="text-brandRed">Ad</span><span class="text-brandGreen">Pesa</span></a>
    </nav>

    <div class="max-w-md w-full mx-auto my-12 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-2">Log in to manage your earnings dashboard</p>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" required placeholder="you@example.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandRed focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandRed focus:outline-none">
            </div>
            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center text-gray-600"><input type="checkbox" class="rounded text-brandRed mr-2"> Remember me</label>
                <a href="#" class="text-brandRed font-medium hover:underline">Forgot password?</a>
            </div>
            <button type="submit" class="w-full bg-brandRed hover:bg-brandRed-hover text-white font-bold py-3.5 rounded-lg shadow-md transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? <a href="signup.html" class="text-brandGreen font-bold hover:underline">Sign up</a>
        </p>
    </div>

    <footer class="text-center py-6 text-xs text-gray-400">
        &copy; 2026 AdPesa. All rights reserved.
    </footer>
</body>
</html>
