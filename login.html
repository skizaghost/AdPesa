<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - AdPesa</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Header / Navigation -->
  <header class="w-full bg-white border-b border-slate-200 py-4 px-6 md:px-12 flex justify-between items-center">
    <!-- Brand Logo / Link to Landing Page -->
    <a href="index.html" class="flex items-center space-x-2 text-xl font-bold text-slate-900">
      <span class="text-emerald-600 text-2xl">AdPesa</span>
    </a>
    <div class="flex items-center space-x-6 text-sm font-medium">
      <a href="index.html" class="text-slate-600 hover:text-emerald-600 transition">Home</a>
      <a href="signup.html" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm transition">Sign Up</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md w-full mx-auto my-12 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
      
      <!-- Card Header -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">
          Welcome back to <span class="text-emerald-600">AdPesa</span>
        </h1>
        <p class="text-sm text-slate-600">Enter your credentials to access your dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="e.g. john@example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
            <a href="#" class="text-xs text-emerald-600 hover:underline">Forgot password?</a>
          </div>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="remember" class="rounded text-emerald-600 focus:ring-emerald-500 h-4 w-4 border-slate-300">
            <span class="text-xs text-slate-600">Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          Sign In
        </button>

      </form>

      <p class="text-center text-sm text-slate-600 mt-6">
        Don't have an account? <a href="signup.html" class="text-emerald-600 font-semibold hover:underline">Sign up</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-200 bg-white">
    &copy; 2026 AdPesa. All rights reserved.
  </footer>

</body>
</html>
