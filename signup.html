<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AdPesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: { DEFAULT: '#E50914', hover: '#B91C1C' },
                        brandGreen: { DEFAULT: '#009A44', hover: '#007A36' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans">
    <nav class="bg-white border-b px-6 py-4">
        <a href="index.html" class="text-2xl font-black"><span class="text-brandRed">Ad</span><span class="text-brandGreen">Pesa</span></a>
    </nav>

    <div class="max-w-lg w-full mx-auto my-10 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-gray-900">Get Started with AdPesa</h2>
            <p class="text-sm text-gray-500 mt-1">Start receiving instant M-Pesa payouts</p>
        </div>

        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                <input type="text" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandGreen focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandGreen focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">M-Pesa Phone Number</label>
                <div class="relative">
                    <span class="absolute left-3 top-2.5 text-gray-500 font-medium">+254</span>
                    <input type="tel" required placeholder="712345678" pattern="[0-9]{9}" class="w-full pl-16 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandGreen focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandGreen focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-brandGreen hover:bg-brandGreen-hover text-white font-bold py-3.5 rounded-lg shadow-md transition">
                Create Account &amp; Pay KES 500
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account? <a href="login.html" class="text-brandRed font-bold hover:underline">Log in</a>
        </p>
    </div>

    <footer class="text-center py-6 text-xs text-gray-400">
        &copy; 2026 AdPesa. All rights reserved.
    </footer>
</body>
</html>
