<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Dashboard - AdPesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: { DEFAULT: '#E50914', hover: '#B91C1C' },
                        brandGreen: { DEFAULT: '#009A44', hover: '#007A36' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 flex min-h-screen font-sans">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <a href="index.html" class="text-2xl font-black tracking-tight"><span class="text-brandRed">Ad</span><span class="text-brandGreen">Pesa</span></a>
            <nav class="mt-8 space-y-2">
                <a href="#" class="flex items-center gap-3 bg-slate-800 text-brandGreen font-bold px-4 py-3 rounded-lg">📊 Overview</a>
                <a href="#" class="flex items-center gap-3 text-slate-400 hover:text-white px-4 py-3 rounded-lg transition">📈 Analytics</a>
                <a href="#" class="flex items-center gap-3 text-slate-400 hover:text-white px-4 py-3 rounded-lg transition">📲 Ad Placements</a>
                <a href="#" class="flex items-center gap-3 text-slate-400 hover:text-white px-4 py-3 rounded-lg transition">💸 Withdrawal History</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <a href="login.html" class="text-slate-400 hover:text-brandRed font-medium text-sm">← Log Out</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
                <p class="text-sm text-gray-500">Welcome back, Developer</p>
            </div>
            <div class="w-10 h-10 bg-brandRed text-white rounded-full flex items-center justify-center font-bold">
                AD
            </div>
        </header>

        <!-- Metric Cards -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm border-l-4 border-l-brandGreen">
                <p class="text-sm font-semibold text-gray-500">Current Balance</p>
                <h3 class="text-3xl font-extrabold text-brandGreen mt-2">KES 14,850.00</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm border-l-4 border-l-brandRed">
                <p class="text-sm font-semibold text-gray-500">Total Impressions</p>
                <h3 class="text-3xl font-extrabold text-gray-900 mt-2">128,450</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm border-l-4 border-l-gray-900">
                <p class="text-sm font-semibold text-gray-500">Average CTR</p>
                <h3 class="text-3xl font-extrabold text-gray-900 mt-2">3.42%</h3>
            </div>
        </div>

        <!-- STK Withdrawal Action -->
        <div class="bg-gradient-to-r from-brandGreen to-emerald-700 text-white p-6 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-center mb-8">
            <div>
                <h3 class="text-xl font-bold">Ready for Instant Withdrawal?</h3>
                <p class="text-sm text-emerald-100 mt-1">Minimum payout threshold (KES 100) reached.</p>
            </div>
            <button class="mt-4 sm:mt-0 bg-white text-brandGreen hover:bg-emerald-50 font-bold px-6 py-3 rounded-xl shadow transition">
                Withdraw via M-Pesa 📲
            </button>
        </div>
    </main>
</body>
</html>
